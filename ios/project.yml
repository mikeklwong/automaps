name: Automaps
options:
  bundleIdPrefix: com.automaps
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 154.0.0
targets:
  Automaps:
    type: application
    platform: iOS
    sources: [Automaps]
    dependencies:
      - package: WebRTC
      - target: VoiceIntents
    info:
      path: Info.plist
    entitlements:
      path: Automaps.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.automaps.app
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Automaps.entitlements
        GENERATE_INFOPLIST_FILE: NO
  VoiceIntents:
    type: app-extension
    platform: iOS
    sources: [VoiceIntents]
    info:
      path: VoiceIntents/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.automaps.app.voice-intents
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Automaps:
    build:
      targets:
        Automaps: all
    run:
      config: Debug
